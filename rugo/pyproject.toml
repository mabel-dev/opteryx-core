[build-system]
requires = ["mesonpy", "meson", "ninja", "cython"]
build-backend = "mesonpy"

[project]
name = "rugo"
version = "0.1.0"
description = "High-performance parquet and JSONL reader without Apache Arrow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "draken>=0.1.0",  # Only for external users; Meson handles monorepo builds
]
license = { text = "Apache-2.0" }
authors = [
    { name = "Justin Joyce", email = "justin.joyce@joocer.com" }
]
keywords = ["parquet", "jsonl", "reader", "columnar", "simd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/joocer/opteryx"
Repository = "https://github.com/joocer/opteryx"
Documentation = "https://opteryx.dev/docs/rugo"
Issues = "https://github.com/joocer/opteryx/issues"

[tool.meson-python.editable-install]
rebuild-on-editable-install = true

[tool.mypy]
ignore_missing_imports = true
strict = false
