name: Release to PyPI

on:
  release:
    types: [published]
    branches:
      - 'main'
  push:
    tags:
      - 'ci-*'

jobs:
  build-manylinux:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner-python: "3.13"
            pybuild: "3.13"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
          - runner-python: "3.13"
            pybuild: "3.14T"
            # try a newer manylinux variant for 3.14T (may include cp314T)
            manylinux_image: "quay.io/pypa/manylinux_2_31_x86_64"
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runner-python }}

      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          path: io

      - name: Set permissions for build-wheels.sh
        run: chmod +x io/dev/build-wheels.sh

      - name: Build Wheels
        # Builds optimized wheels with LTO enabled for better xxhash and critical path performance
        # PGO (Profile-Guided Optimization) is supported but disabled by default
        run: >
          docker run --rm
          -e PLAT=manylinux2014_x86_64
          -e PACKAGE_NAME=opteryx
          -e PYTHON_VERSION=${{ matrix.pybuild }}
          -e OPTERYX_ENABLE_LTO=1
          -e OPTERYX_ENABLE_PGO=0
          -v `pwd`:/io
          --workdir /io
          ${{ matrix.manylinux_image }}
          io/dev/build-wheels.sh

      - name: Verify wheel xxhash SIMD backend (release)
        run: |
          pip install io/dist/*manylinux2014_x86_64*.whl
          python -c "import opteryx.third_party.cyan4973.xxhash as _xh; print('release wheel xxhash compiled vector backend:', _xh.get_compiled_xxhash_vector())"
      - name: Archive Wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.pybuild }}
          path: io/dist/*manylinux2014_x86_64*.whl

  upload:
    needs: [build-manylinux]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip setuptools packaging wheel build cython numpy setuptools_rust

      - name: Create source dist
        run: python setup.py sdist

      - name: Stage linux 3.13
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-3.13
          path: dist-linux-3.13
      - run: mv -v dist-linux-3.13/* dist/

      - name: Stage linux 3.14T
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-3.14T
          path: dist-linux-3.14T
      - run: |
          if [ -d dist-linux-3.14T ]; then
            mv -v dist-linux-3.14T/* dist/
          else
            echo "dist-linux-3.14T artifact not found; skipping"
          fi

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}