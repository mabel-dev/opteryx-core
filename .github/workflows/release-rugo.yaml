name: Release rugo to PyPI

# Releasing rugo is a SEPARATE decision from releasing opteryx_core. This runs
# only for tags prefixed `rugo-` (e.g. `rugo-0.2.0`). opteryx_core's release.yaml
# is prefix-scoped to `opteryx-*` tags, so the two are mutually exclusive — a
# `rugo-*` tag (or a rugo- GitHub Release) never fires the opteryx pipeline, and
# vice versa.
#
# Unlike opteryx_core (Linux 3.12/3.13/3.14 x86-64, macOS 3.14 arm64 only),
# rugo targets a broad matrix:
#   Python  : 3.11, 3.12, 3.13, 3.14 (GIL)
#   Platform: Linux x86-64 + aarch64 (manylinux), macOS arm64
#
# `all-*` is the one tag that fires all three pipelines (opteryx_core, rugo,
# libskene) from a single release decision — see release.yaml. It does NOT make
# the three releases one release: each pipeline still runs its own floor, builds
# its own wheels and publishes independently, so one can go red or fail to
# publish while the others ship. Each component's version still comes from its
# own `__version__.py`, never from the tag.
on:
  push:
    tags:
      - 'rugo-*'
      - 'all-*'

jobs:
  # ── Release floor: three parallel suites that MUST all pass before any wheel
  # is built or published. This is the stable floor for rugo (our most
  # marketable component): PyArrow-oracle conformance (read/write every type),
  # the notebook's advertised public API, and the CLI. A red suite blocks the
  # PyPI publish entirely (build-linux/build-macos `needs: floor`).
  floor:
    name: rugo floor (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [oracle, notebook, cli]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade cython setuptools pyarrow pytest

      - name: Compile rugo (draken + rugo only — no opteryx SQL engine, no Rust)
        run: python rugo/setup.py build_ext --inplace

      - name: Run floor suite — ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            oracle)   python -m pytest tests/rugo/test_oracle_conformance.py -q ;;
            notebook) python -m pytest tests/rugo/test_notebook_actions.py -q ;;
            cli)      python -m pytest tests/rugo/test_cli.py -q ;;
          esac

  build-linux:
    needs: floor
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # x86_64: native runner
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.11"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.12"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.13"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.14"
          # aarch64: native ARM runner — no QEMU needed
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.11"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.12"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.13"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.14"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Make build script executable
        run: chmod +x dev/build-rugo-wheels.sh

      - name: Build rugo wheels (manylinux ${{ matrix.arch }}, py ${{ matrix.pybuild }})
        run: |
          set -euo pipefail
          docker run --rm \
            -e PLAT="manylinux_2_34_${{ matrix.arch }}" \
            -e PYTHON_VERSION=${{ matrix.pybuild }} \
            -e OPTERYX_ENABLE_LTO=1 \
            -v "$(pwd)":/io \
            --workdir /io \
            "quay.io/pypa/manylinux_2_34_${{ matrix.arch }}" \
            /io/dev/build-rugo-wheels.sh

      - name: Verify wheel imports (release gate — MUST NOT be continue-on-error)
        # Same gate as opteryx_core's release.yaml. rugo is exposed to the same
        # break: rugo_native resolves 6 draken_* symbols via RTLD_GLOBAL, and
        # both wheels are linked with the same LD_EXTRA from build_common.py. A
        # symbol-hiding change that breaks that bridge produces a wheel that
        # imports nothing — which is how opteryx_core 0.9.56 took production
        # down while every dev-build signal was green. Only importing the real
        # manylinux wheel catches it.
        run: |
          set -euo pipefail
          chmod +x dev/verify-wheel-imports.sh
          docker run --rm \
            -e OPTERYX_ALLOW_KNOWN_GRPC_ABORT="${OPTERYX_ALLOW_KNOWN_GRPC_ABORT:-0}" \
            -v "$(pwd)":/io \
            --workdir /io \
            "quay.io/pypa/manylinux_2_34_${{ matrix.arch }}" \
            /io/dev/verify-wheel-imports.sh /io/dist rugo
        env:
          # TODO(remove once the C++ symbol-hiding fix lands): `import rugo;
          # import grpc` aborts today, exactly as opteryx_core does. Accepting
          # that KNOWN failure keeps it from blocking releases; the bridge-symbol
          # check still gates hard. Setting this to 0 is the goal.
          OPTERYX_ALLOW_KNOWN_GRPC_ABORT: "1"

      - name: Archive wheels
        uses: actions/upload-artifact@v4
        with:
          name: rugo-linux-${{ matrix.arch }}-${{ matrix.pybuild }}
          path: dist/*manylinux*.whl

  build-macos:
    needs: floor
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # macos-14 = Apple Silicon (arm64) only. macos-13 (Intel x86_64) was
        # dropped — rugo publishes macOS arm64 wheels, not Intel.
        os: [macos-14]
        pybuild: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python ${{ matrix.pybuild }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pybuild }}
          allow-prereleases: true

      - name: Make build script executable
        run: chmod +x dev/build-rugo-wheels-macos.sh

      - name: Build rugo wheel (${{ matrix.os }}, py ${{ matrix.pybuild }})
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          OPTERYX_ENABLE_LTO: "1"
        run: ./dev/build-rugo-wheels-macos.sh

      - name: Archive wheels
        uses: actions/upload-artifact@v4
        with:
          name: rugo-macos-${{ matrix.os }}-${{ matrix.pybuild }}
          path: dist/delocated/*.whl

  upload:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all rugo wheels
        uses: actions/download-artifact@v4.1.7
        with:
          path: dist-staging

      - name: Stage wheels into dist/
        run: |
          mkdir -p dist
          find dist-staging -name '*.whl' -exec mv -v {} dist/ \;
          echo "=== wheels to publish ===" && ls -lh dist/

      - name: Publish rugo 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Distinct token, scoped to the `rugo` PyPI project (not opteryx_core).
          password: ${{ secrets.RUGO_PYPI_API_TOKEN }}

  # ── Mirror the release to mabel-dev/rugo.dev, the public docs/releases hub for
  # rugo. This is a NOTES-ONLY GitHub Release (no wheel assets — PyPI is the
  # distribution channel); it exists as the public changelog. It runs only after
  # the PyPI publish succeeds, so the release note never points at a version that
  # failed to ship.
  #
  # The default GITHUB_TOKEN cannot write to another repo, so this needs a
  # credential with `contents: write` on mabel-dev/rugo.dev, stored here as the
  # RUGO_DEV_RELEASE_TOKEN secret. Creating the release also creates the tag
  # (e.g. `rugo-0.2.0`) in rugo.dev, matching the tag used here.
  github-release:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      # Needed only to read rugo/__version__.py below.
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Create notes-only release on mabel-dev/rugo.dev
        env:
          GH_TOKEN: ${{ secrets.RUGO_DEV_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # rugo.dev is rugo's public changelog, so its release must be named for
          # the rugo version that just shipped. Under a `rugo-*` tag the trigger
          # tag IS that name. Under an `all-*` tag it is not — that tag names a
          # combined release decision across three components — so fall back to
          # rugo's own single source of truth rather than publishing an `all-…`
          # entry in rugo's changelog.
          case "${GITHUB_REF_NAME}" in
            all-*)
              VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rugo/__version__.py)
              if [ -z "${VERSION}" ]; then
                echo "ERROR: could not read __version__ from rugo/__version__.py" >&2
                exit 1
              fi
              RELEASE_TAG="rugo-${VERSION}"
              ;;
            *)
              RELEASE_TAG="${GITHUB_REF_NAME}"
              ;;
          esac
          echo "Creating rugo.dev release: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            --repo mabel-dev/rugo.dev \
            --title "${RELEASE_TAG}" \
            --generate-notes
