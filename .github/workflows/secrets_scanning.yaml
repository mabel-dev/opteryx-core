name: Secrets Scanner

# on_push.yaml calls this for every branch EXCEPT main, so pushes to main
# and pull requests into main were never secret-scanned. The push/pull_request
# triggers below close that gap; branch coverage still arrives via
# workflow_call, so the trigger list here is deliberately main-only.
on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '43 6 * * *'

jobs:
  fides:
    # The scan itself, and the issue it files on a finding, live in
    # mabel-dev/opteryx.app/.github/workflows/fides_scan.yaml. Only the
    # triggers above are per-repository.
    uses: mabel-dev/opteryx.app/.github/workflows/fides_scan.yaml@main
    secrets:
      FIDES_ISSUE_TOKEN: ${{ secrets.FIDES_ISSUE_TOKEN }}
