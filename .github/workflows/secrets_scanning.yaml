name: Secrets Scanner

# on_push.yaml calls this for every branch EXCEPT main, so pushes to main
# and pull requests into main were never secret-scanned. The push/pull_request
# triggers below close that gap; branch coverage still arrives via
# workflow_call, so the trigger list here is deliberately main-only.
on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fides:
    name: Fides Secrets Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: fides-scanner
        uses: joocer/fides@main