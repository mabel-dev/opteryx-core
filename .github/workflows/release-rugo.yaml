name: Release rugo to PyPI

# Releasing rugo is a SEPARATE decision from releasing opteryx_core. This runs
# only for tags prefixed `rugo-` (e.g. `rugo-0.2.0`). opteryx_core's release.yaml
# is prefix-scoped to `opteryx-*` tags, so the two are mutually exclusive — a
# `rugo-*` tag (or a rugo- GitHub Release) never fires the opteryx pipeline, and
# vice versa.
#
# Unlike opteryx_core (3.14 / x86-64 only), rugo targets a broad matrix:
#   Python  : 3.11, 3.12, 3.13, 3.14 (GIL) + 3.14t (free-threaded)
#   Platform: Linux x86-64 + aarch64 (manylinux), macOS arm64
on:
  push:
    tags:
      - 'rugo-*'

jobs:
  build-linux:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # x86_64: native runner
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.11"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.12"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.13"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.14"
          - arch: x86_64
            runner: ubuntu-latest
            pybuild: "3.14t"
          # aarch64: native ARM runner — no QEMU needed
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.11"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.12"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.13"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.14"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pybuild: "3.14t"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Make build script executable
        run: chmod +x dev/build-rugo-wheels.sh

      - name: Build rugo wheels (manylinux ${{ matrix.arch }}, py ${{ matrix.pybuild }})
        run: |
          set -euo pipefail
          docker run --rm \
            -e PLAT="manylinux2014_${{ matrix.arch }}" \
            -e PYTHON_VERSION=${{ matrix.pybuild }} \
            -v "$(pwd)":/io \
            --workdir /io \
            "quay.io/pypa/manylinux2014_${{ matrix.arch }}" \
            /io/dev/build-rugo-wheels.sh

      - name: Archive wheels
        uses: actions/upload-artifact@v4
        with:
          name: rugo-linux-${{ matrix.arch }}-${{ matrix.pybuild }}
          path: dist/*manylinux*.whl

  build-macos:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # macos-14 = Apple Silicon (arm64) only. macos-13 (Intel x86_64) was
        # dropped — rugo publishes macOS arm64 wheels, not Intel.
        os: [macos-14]
        pybuild: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python ${{ matrix.pybuild }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pybuild }}
          allow-prereleases: true

      - name: Make build script executable
        run: chmod +x dev/build-rugo-wheels-macos.sh

      - name: Build rugo wheel (${{ matrix.os }}, py ${{ matrix.pybuild }})
        env:
          # arm64 (macos-14) deployment target.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: ./dev/build-rugo-wheels-macos.sh

      - name: Archive wheels
        uses: actions/upload-artifact@v4
        with:
          name: rugo-macos-${{ matrix.os }}-${{ matrix.pybuild }}
          path: dist/delocated/*.whl

  upload:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all rugo wheels
        uses: actions/download-artifact@v4.1.7
        with:
          path: dist-staging

      - name: Stage wheels into dist/
        run: |
          mkdir -p dist
          find dist-staging -name '*.whl' -exec mv -v {} dist/ \;
          echo "=== wheels to publish ===" && ls -lh dist/

      - name: Publish rugo 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Distinct token, scoped to the `rugo` PyPI project (not opteryx_core).
          password: ${{ secrets.RUGO_PYPI_API_TOKEN }}
