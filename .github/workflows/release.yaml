name: Release to PyPI

on:
  release:
    types: [published]
    branches:
      - 'main'
  push:
    tags:
      - 'ci-*'

jobs:
  build-manylinux:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python-version: ["3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          path: io

      - name: Set permissions for build-wheels.sh
        run: chmod +x io/dev/build-wheels.sh

      - name: Build Wheels
        # Builds optimized wheels with LTO enabled for better xxhash and critical path performance
        # PGO (Profile-Guided Optimization) is supported but disabled by default
        run: >
          docker run --rm
          -e PLAT=manylinux2014_x86_64
          -e PACKAGE_NAME=opteryx
          -e PYTHON_VERSION=${{ matrix.python-version }}
          -e OPTERYX_ENABLE_LTO=1
          -e OPTERYX_ENABLE_PGO=0
          -v `pwd`:/io
          --workdir /io
          quay.io/pypa/manylinux2014_x86_64
          io/dev/build-wheels.sh

      - name: Verify wheel xxhash SIMD backend (release)
        run: |
          # install the freshly built manylinux wheel and print the compiled xxhash backend
          pip install io/dist/*manylinux2014_x86_64*.whl
          python - <<'PY'
import opteryx.third_party.cyan4973.xxhash as _xh
print('release wheel xxhash compiled vector backend:', _xh.get_compiled_xxhash_vector())
PY
      - name: Archive Wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.python-version }}
          path: io/dist/*manylinux2014_x86_64*.whl

  upload:
    needs: [build-manylinux]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip setuptools packaging wheel build cython numpy setuptools_rust

      - name: Create source dist
        run: python setup.py sdist

      - name: Stage linux 3.13
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-3.13
          path: dist-linux-3.13
      - run: mv -v dist-linux-3.13/* dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}