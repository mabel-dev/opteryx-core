name: Static Analysis

on:
  - workflow_call
  - push

jobs:
  test:
    name: Bandit Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set Up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade bandit rugo "opteryx-upload>=0.6.0"

      - name: Report Tool Versions
        run: |
          # Tools are deliberately unpinned so a new check reaches us the day it
          # ships. The cost of that is a run whose result depends on a version
          # nothing in the repo records — so record it here. A red build must be
          # reproducible from its own log.
          python --version
          bandit --version

      - name: Execute Test
        id: bandit
        run: |
          set +e
          bandit -c pyproject.toml -r opteryx -f json -o bandit-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload results to Opteryx
        env:
          UPLOAD_CLIENT: ${{ secrets.UPLOAD_CLIENT }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: python scripts/upload_bandit_results.py bandit-report.json

      - name: Fail if issues found
        if: steps.bandit.outputs.exit_code != '0'
        run: exit 1

  mypy:
    name: Type Checks
    runs-on: ubuntu-latest
    if: false  # disable the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set Up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip mypy
          pip install -r $GITHUB_WORKSPACE/tests/requirements.txt

      - name: Execute Test
        run: mypy --ignore-missing-imports --python-version 3.11 --no-strict-optional --check-untyped-defs opteryx
