name: SQL Logic Tests

on:
  # Every commit that can reach main is covered: PR commits by `pull_request`,
  # main itself by `push`. `push` is scoped to main rather than "every branch but
  # main" so a same-repo PR does not run the whole suite twice for one commit.
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * *"

jobs:
  sqllogictest:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      # libssl-dev and pkg-config are preinstalled on the ubuntu-24.04 runner
      # image, so assert rather than install: `apt-get update` hangs for hours
      # whenever the azure.archive.ubuntu.com mirror flakes. Fails loudly if the
      # image ever drops them.
      - name: Verify system packages
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          pkg-config --exists openssl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and sqllogictest build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqllogictest
          key: sqllogictest-${{ runner.os }}-${{ hashFiles('.github/workflows/sqllogictest.yaml') }}

      - name: Build sqllogictest binary
        run: |
          if ! command -v sqllogictest &>/dev/null; then
            cargo install sqllogictest-bin \
              --git https://github.com/mabel-dev/sqllogictest \
              --locked
          fi

      - name: Install Opteryx requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy cython setuptools-rust
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Report Tool Versions
        run: |
          # Requirements are deliberately unpinned so upstream fixes reach us
          # promptly. The cost is a run whose result depends on versions nothing
          # in the repo records — so record the resolved set here. A red build
          # must be reproducible from its own log.
          python --version
          rustc --version
          python -m uv pip freeze

      - name: Compile Opteryx extensions
        run: make compile

      # `make slt-coverage` runs exactly what `make slt` runs (same groups, same
      # driver) with the Python driver under coverage, so the suite result is
      # unchanged: it exits non-zero if any slt group failed. The coverage figure is
      # reported below and does NOT gate the job - there is no threshold yet. It
      # measures Python only (planning); .pyx and native code are not instrumented.
      - name: Run sqllogictest suite (with Python coverage)
        run: make slt-coverage
        env:
          OPTERYX_HOME: ${{ github.workspace }}

      # `if: always()` so a red suite still reports what it covered.
      - name: Report coverage
        if: always()
        run: |
          if [ -f .coverage.slt ]; then
            total=$(COVERAGE_FILE=.coverage.slt python -m coverage report --format=total --fail-under=0)
            {
              echo "### sqllogictest Python coverage: ${total}%"
              echo
              echo "Informational only - no threshold. Python (planner, binder, optimizer) only;"
              echo "Cython modules and native code are not instrumented. Full report: the"
              echo "\`slt-coverage-html\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### sqllogictest Python coverage: no data (the suite did not produce any)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slt-coverage-html
          path: htmlcov/slt
          if-no-files-found: ignore
