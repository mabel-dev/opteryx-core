name: Regression Suite

on:
  push:
    branches-ignore:
      - main  # Exclude the main branch
      - 'refs/tags/*'  # Exclude tags (releases)
  schedule:
    - cron: "0 4 * * *"

jobs:
  regression_matrix:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ["3.14t"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Python ${{ matrix.python-version }} x64
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install system packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # We only need libssl-dev/pkg-config for libcrypto and build tooling
          sudo apt-get install -y libssl-dev pkg-config
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy cython setuptools-rust
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml
          python -m uv pip install --upgrade pytest-reportlog rugo

      - name: Compile
        run: make compile

      - name: Print 'parquet' shared object dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eux
          SO_FILE=$(ls -1 opteryx/rugo/parquet*.so | head -n1)
          echo "Located: $SO_FILE"
          echo "File type: $(file $SO_FILE)"
          echo "ldd output:"
          ldd $SO_FILE || true
          if ! ldd $SO_FILE | grep -q libcrypto; then
            echo "ERROR: libcrypto not linked into $SO_FILE"
            exit 1
          fi

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_KEY }}'

      - name: Run Regression Tests
        id: run_tests
        continue-on-error: true
        run: python -m coverage run -m pytest --report-log=results.jsonl --color=yes
        env:
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;"
          MINIO_END_POINT: "s3.eu-west-2.amazonaws.com"
          GCP_PROJECT_ID: mabeldev
          OPTERYX_DEBUG: 1
          # WP-3 guardrail: run the plan invariant checker after every optimizer
          # strategy so plan corruption is localised to the strategy that caused it.
          VALIDATE_OPTIMIZER_PLANS: 1
          MAX_LOCAL_BUFFER_CAPACITY: 100
          DATA_CATALOG_CONNECTION: '${{ secrets.DATA_CATALOG_CONNECTION }}'
          DATA_CATALOG_STORAGE: '${{ secrets.DATA_CATALOG_STORAGE }}'
          VALKEY_CONNECTION: '${{ secrets.VALKEY_CONNECTION }}'

      - name: Check Coverage
        run: python -m coverage report -m

      - name: Build pytest report
        if: matrix.os == 'ubuntu-latest'
        run: python .github/scripts/pytest_report.py results.jsonl report.md

      - name: Find associated pull request
        if: matrix.os == 'ubuntu-latest'
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const open = prs.data.find(pr => pr.state === "open");
            return open ? open.number : "";
          result-encoding: string

      - name: Post or update pytest report comment
        if: matrix.os == 'ubuntu-latest' && steps.find_pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("report.md", "utf8");
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = "<!-- pytest-report -->";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.result }}

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
