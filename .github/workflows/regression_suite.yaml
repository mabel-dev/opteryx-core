name: Regression Suite

on:
  # Every commit that can reach main is covered: PR commits by `pull_request`,
  # main itself by `push`. `push` is scoped to main rather than "every branch but
  # main" so a same-repo PR does not run the whole suite twice for one commit.
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  # ── Build once, test in parallel. The tree is compiled a single time here and
  # published as an artifact; every test job below restores it instead of running
  # `make compile` itself (~20 minutes each, previously paid three times: here,
  # in the release-floor job and in the old standalone sqllogictest workflow).
  # Same shape as release.yaml `compile` -> `test-python`, so CI and the release
  # floor exercise the tree the same way.
  #
  #   compile ──→ regression_matrix  (pytest tests/ + opteryx-iceberg)
  #           ├─→ release_floor      (make q, rt, dt, st in parallel)
  #           └─→ sqllogictest       (make slt)
  #
  # Parallel rather than serial: the jobs are independent and each needs only
  # the artifact, so wall-clock is compile + the slowest suite, not their sum.
  # Every test job reports on its own; a red one cannot hide another.
  compile:
    name: compile tree
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          architecture: x64

      # libssl-dev and pkg-config are preinstalled on the ubuntu-24.04 runner
      # image, so assert rather than install: `apt-get update` hangs for hours
      # whenever the azure.archive.ubuntu.com mirror flakes. Fails loudly if the
      # image ever drops them. libnghttp2-dev is installed WITHOUT
      # `apt-get update`: the vendored libcurl must have HTTP/2 (setup.py
      # _assert_vendored_curl_http2 fails the build without it).
      - name: Verify system packages
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          sudo apt-get install -y --no-install-recommends libnghttp2-dev
          pkg-config --exists openssl libnghttp2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy cython setuptools-rust
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Report Tool Versions
        run: |
          # Requirements are deliberately unpinned so upstream fixes reach us
          # promptly. The cost is a run whose result depends on versions nothing
          # in the repo records — so record the resolved set here. A red build
          # must be reproducible from its own log.
          python --version
          rustc --version
          python -m uv pip freeze

      - name: Compile
        run: make compile

      # Assert OpenSSL is linked into the extension that actually CALLS it:
      # http_client statically links vendored libcurl, which needs -lssl
      # -lcrypto supplied explicitly (resolve_libcurl in setup.py).
      #
      # This previously checked the shared rugo parquet object, which is built
      # WITHOUT RUGO_ENABLE_HTTP and so references zero libcrypto symbols — it
      # only passed because that object force-linked -lcrypto via
      # --no-as-needed. That force-link is gone (it cost the standalone rugo
      # wheel a vendored 2.6MB libcrypto and a hard OpenSSL dependency), so the
      # check now targets the real consumer.
      - name: Verify libcrypto is linked into the HTTP client
        run: |
          set -eux
          SO_FILE=$(ls -1 opteryx/compiled/http_client*.so | head -n1)
          echo "Located: $SO_FILE"
          echo "File type: $(file $SO_FILE)"
          echo "ldd output:"
          ldd $SO_FILE || true
          if ! ldd $SO_FILE | grep -q libcrypto; then
            echo "ERROR: libcrypto not linked into $SO_FILE"
            exit 1
          fi

      - name: Verify the compiled tree imports
        run: python -c "import draken, rugo, skene, opteryx; print(opteryx.__version__)"

      # `make compile` produces TWO kinds of runtime output and both must be
      # archived: the .so extensions, and the generated-at-build-time .py modules
      # (not tracked in git, so a fresh checkout does not have them). This list is
      # release.yaml's; if a new generated module appears, add it to both. The
      # `Verify the compiled tree imports` step in each test job is the guard.
      # build/ is excluded: build_ext --inplace copies every .so out of it, so
      # including it would double the artifact and restore a stale second copy.
      - name: Archive compiled tree
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tree
          path: |
            **/*.so
            draken/_abi_stamp.py
            opteryx/_draken_abi.py
            rugo/_draken_abi.py
            rugo/_build_identity.py
            skene/_draken_abi.py
            !build/**
          if-no-files-found: error
          retention-days: 1

  regression_matrix:
    needs: compile
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        # MUST match the interpreter `compile` used: the artifact is cpython-314
        # ABI .so files.
        python-version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} x64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          architecture: x64

      # Runtime libssl/libcrypto only: the extensions link them dynamically and
      # this job never compiles. Asserted, not installed (see `compile`).
      - name: Verify system packages
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          pkg-config --exists openssl

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml
          # hadro is the S3 server tests/integration/test_s3_hadro.py reads from.
          # --no-deps: it depends on the published rugo wheel, which would
          # shadow the in-tree rugo restored from the compiled-tree artifact. Its
          # server dependencies (fastapi, uvicorn) come from tests/requirements.txt.
          python -m uv pip install --upgrade --no-deps hadro

      # Restores the .so files over the fresh checkout at their original paths.
      # Nothing in this job recompiles.
      - name: Restore compiled tree
        uses: actions/download-artifact@v4
        with:
          name: compiled-tree

      - name: Verify the compiled tree imports
        run: python -c "import draken, rugo, skene, opteryx; print(opteryx.__version__)"

      # The catalog-backed tests skip themselves when opteryx_catalog is absent
      # (dev machines legitimately have none). That skip must never be how CI
      # passes: assert the install landed, so a broken requirement is red here
      # rather than ~300 quietly-skipped tests later.
      - name: Verify opteryx_catalog is installed
        run: |
          python -c "import opteryx_catalog, importlib.metadata as m; print('opteryx-catalog', m.version('opteryx-catalog'))"

      # Same reasoning for the S3 end-to-end tests: skipping is for dev machines
      # without hadro, never how CI passes.
      - name: Verify hadro is installed
        run: |
          python -c "import hadro, fastapi, uvicorn, importlib.metadata as m; print('hadro', m.version('hadro'))"

      # tests/storage/test_clone_metastore_gate.py and test_egress_protection.py read the
      # catalog's SOURCE from the sibling checkout ../opteryx-catalog, not the installed
      # wheel: they pin this engine against the catalog it ships beside (release order is
      # catalog, then core), and the wheel may be a release behind. actions/checkout
      # cannot place a repository outside the workspace, so this clones beside it.
      - name: Checkout opteryx-catalog beside the workspace
        run: git clone --depth 1 https://github.com/mabel-dev/opteryx-catalog.git "$GITHUB_WORKSPACE/../opteryx-catalog"

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_KEY }}'

      - name: Run Regression Tests
        run: python -m coverage run -m pytest --color=yes
        env:
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;"
          MINIO_END_POINT: "s3.eu-west-2.amazonaws.com"
          GCP_PROJECT_ID: mabeldev
          OPTERYX_DEBUG: 1
          # WP-3 guardrail: run the plan invariant checker after every optimizer
          # strategy so plan corruption is localised to the strategy that caused it.
          VALIDATE_OPTIMIZER_PLANS: 1
          MAX_LOCAL_BUFFER_CAPACITY: 100
          DATA_CATALOG_CONNECTION: '${{ secrets.DATA_CATALOG_CONNECTION }}'
          DATA_CATALOG_STORAGE: '${{ secrets.DATA_CATALOG_STORAGE }}'
          VALKEY_CONNECTION: '${{ secrets.VALKEY_CONNECTION }}'

      - name: Check Coverage
        run: python -m coverage report -m

      # opteryx-iceberg (its own repo, because it depends on pyiceberg) is how a
      # workspace reads external Iceberg tables through this engine. Its whole
      # suite - SqlCatalog tests and the Lakekeeper REST-catalog-over-S3 tests -
      # runs here against THIS build, so a core change that breaks Iceberg reads
      # is red on the core PR rather than after a release. Its main branch is
      # used, not the PyPI wheel, and it is put on PYTHONPATH behind the
      # in-tree core, so nothing installed can shadow the engine under test.
      # The Lakekeeper stack is opteryx-iceberg's own script (host network,
      # Postgres + Silo S3); its environment is loaded per step, never into
      # GITHUB_ENV, so no AWS_* setting reaches the core tests above.
      - name: Checkout opteryx-iceberg
        uses: actions/checkout@v4
        with:
          repository: mabel-dev/opteryx-iceberg
          path: opteryx-iceberg

      - name: Start Lakekeeper
        id: lakekeeper
        working-directory: opteryx-iceberg
        run: |
          set -a; source scripts/lakekeeper.env; set +a
          scripts/lakekeeper.sh up

      - name: Run opteryx-iceberg tests
        working-directory: opteryx-iceberg
        run: |
          set -a; source scripts/lakekeeper.env; set +a
          python -m pytest tests/ -v --color=yes
        env:
          # Fail, don't skip, if the Lakekeeper tests cannot see the stack.
          LAKEKEEPER_REQUIRED: 1
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opteryx-iceberg
          # The query battery's data and TPC-H SQL: this checkout's testdata/
          # and tests/performance/tpch/opteryx/queries.
          OPTERYX_CORE_ROOT: ${{ github.workspace }}

      - name: Lakekeeper logs
        if: failure() && steps.lakekeeper.outcome != 'skipped'
        working-directory: opteryx-iceberg
        run: scripts/lakekeeper.sh logs

  # The release floor (release.yaml `test-python`) run on every commit, so a red
  # floor is found on main/PR rather than at tag time. Same suites, same
  # invocations: make q, rt, dt, st, run as a matrix so each reports on its own.
  # `make slt`, the fifth floor suite, is the `sqllogictest` job below. None of
  # these need cloud credentials, so no secrets.
  release_floor:
    needs: compile
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One red suite must not cancel the others, or a single failure hides the
      # state of the rest. Never add continue-on-error.
      fail-fast: false
      matrix:
        include:
          - target: q
            name: make q — SQL shape regression battery
          - target: rt
            name: make rt — rugo unit tests
          - target: dt
            name: make dt — draken unit tests
          - target: st
            name: make st — skene native suite + Python bindings
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # MUST match the interpreter `compile` used. The Makefile invokes
      # `python3.14` by name (Makefile PYTHON ?=).
      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          architecture: x64

      - name: Verify system packages
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          pkg-config --exists openssl

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Restore compiled tree
        uses: actions/download-artifact@v4
        with:
          name: compiled-tree

      - name: Verify the compiled tree imports
        run: python -c "import draken, rugo, skene, opteryx; print(opteryx.__version__)"

      # `make q` runs the catalog-backed MERGE/UPDATE/DELETE/OPTIMIZE tests, which
      # skip themselves without opteryx_catalog. A skip must never be how the
      # floor passes (0.9.155 shipped refusing every MERGE for that reason).
      - name: Verify opteryx_catalog is installed
        run: |
          python -c "import opteryx_catalog, importlib.metadata as m; print('opteryx-catalog', m.version('opteryx-catalog'))"

      - name: ${{ matrix.name }}
        run: make ${{ matrix.target }}

  sqllogictest:
    needs: compile
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          architecture: x64

      - name: Verify system packages
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          pkg-config --exists openssl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same cache key as release.yaml `test-python` (slt leg), so a warm cache
      # makes the build below a no-op in both. Bump the version if the install
      # command below changes.
      - name: Cache cargo registry and sqllogictest build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqllogictest
          key: sqllogictest-${{ runner.os }}-v1

      - name: Build sqllogictest binary
        run: |
          if ! command -v sqllogictest &>/dev/null; then
            cargo install sqllogictest-bin \
              --git https://github.com/mabel-dev/sqllogictest \
              --locked
          fi

      - name: Install Opteryx requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Restore compiled tree
        uses: actions/download-artifact@v4
        with:
          name: compiled-tree

      - name: Verify the compiled tree imports
        run: python -c "import draken, rugo, skene, opteryx; print(opteryx.__version__)"

      # The slt suite exercises catalog-backed writes; same skip-is-not-a-pass
      # rule as the other suites.
      - name: Verify opteryx_catalog is installed
        run: |
          python -c "import opteryx_catalog, importlib.metadata as m; print('opteryx-catalog', m.version('opteryx-catalog'))"

      # `make slt-coverage` runs exactly what `make slt` runs (same groups, same
      # driver) with the Python driver under coverage, so the suite result is
      # unchanged: it exits non-zero if any slt group failed. The coverage figure is
      # reported below and does NOT gate the job - there is no threshold yet. It
      # measures Python only (planning); .pyx and native code are not instrumented.
      - name: Run sqllogictest suite (with Python coverage)
        run: make slt-coverage
        env:
          OPTERYX_HOME: ${{ github.workspace }}

      # `if: always()` so a red suite still reports what it covered.
      - name: Report coverage
        if: always()
        run: |
          if [ -f .coverage.slt ]; then
            total=$(COVERAGE_FILE=.coverage.slt python -m coverage report --format=total --fail-under=0)
            {
              echo "### sqllogictest Python coverage: ${total}%"
              echo
              echo "Informational only - no threshold. Python (planner, binder, optimizer) only;"
              echo "Cython modules and native code are not instrumented. Full report: the"
              echo "\`slt-coverage-html\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### sqllogictest Python coverage: no data (the suite did not produce any)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slt-coverage-html
          path: htmlcov/slt
          if-no-files-found: ignore
