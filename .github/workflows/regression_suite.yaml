name: Regression Suite

on:
  push:
    branches-ignore:
      - main  # Exclude the main branch
      - 'refs/tags/*'  # Exclude tags (releases)
  schedule:
    - cron: "0 4 * * *"

jobs:
  regression_matrix:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Python ${{ matrix.python-version }} x64
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      # libssl-dev and pkg-config are preinstalled on the ubuntu-24.04 runner
      # image, so assert rather than install: `apt-get update` hangs for hours
      # whenever the azure.archive.ubuntu.com mirror flakes. Fails loudly if the
      # image ever drops them.
      - name: Verify system packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dpkg -s libssl-dev pkg-config > /dev/null
          pkg-config --exists openssl
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy cython setuptools-rust
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Compile
        run: make compile

      # Assert OpenSSL is linked into the extension that actually CALLS it:
      # http_client statically links vendored libcurl, which needs -lssl
      # -lcrypto supplied explicitly (resolve_libcurl in setup.py).
      #
      # This previously checked the shared rugo parquet object, which is built
      # WITHOUT RUGO_ENABLE_HTTP and so references zero libcrypto symbols — it
      # only passed because that object force-linked -lcrypto via
      # --no-as-needed. That force-link is gone (it cost the standalone rugo
      # wheel a vendored 2.6MB libcrypto and a hard OpenSSL dependency), so the
      # check now targets the real consumer.
      - name: Verify libcrypto is linked into the HTTP client
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eux
          SO_FILE=$(ls -1 opteryx/compiled/http_client*.so | head -n1)
          echo "Located: $SO_FILE"
          echo "File type: $(file $SO_FILE)"
          echo "ldd output:"
          ldd $SO_FILE || true
          if ! ldd $SO_FILE | grep -q libcrypto; then
            echo "ERROR: libcrypto not linked into $SO_FILE"
            exit 1
          fi

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_KEY }}'

      - name: Run Regression Tests
        run: python -m coverage run -m pytest --color=yes
        env:
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;"
          MINIO_END_POINT: "s3.eu-west-2.amazonaws.com"
          GCP_PROJECT_ID: mabeldev
          OPTERYX_DEBUG: 1
          # WP-3 guardrail: run the plan invariant checker after every optimizer
          # strategy so plan corruption is localised to the strategy that caused it.
          VALIDATE_OPTIMIZER_PLANS: 1
          MAX_LOCAL_BUFFER_CAPACITY: 100
          DATA_CATALOG_CONNECTION: '${{ secrets.DATA_CATALOG_CONNECTION }}'
          DATA_CATALOG_STORAGE: '${{ secrets.DATA_CATALOG_STORAGE }}'
          VALKEY_CONNECTION: '${{ secrets.VALKEY_CONNECTION }}'

      - name: Check Coverage
        run: python -m coverage report -m
