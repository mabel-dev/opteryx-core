name: Release to PyPI

on:
  push:
    tags:
      # Releasing opteryx_core is prefix-scoped so it can never be triggered by a
      # rugo release (rugo uses `rugo-*` tags — see release-rugo.yaml). Previously
      # this ran on every `release: published`, so a `rugo-` GitHub Release fired
      # it too; tag-prefix triggers make the two release decisions independent.
      - 'opteryx-*'   # release opteryx_core to PyPI
      - 'all-*'       # release opteryx_core + rugo + libskene together
      - 'ci-*'        # CI / dry-run builds

jobs:
  # ── Release floor: the absolute minimum operational proof, run BEFORE any
  # wheel is built or published. rugo and skene have had this since their
  # pipelines were written (release-rugo.yaml / release-skene.yaml `floor`);
  # opteryx_core — the component that bundles both — had no test gate at all:
  # it went straight from a tag to building and publishing wheels, with only
  # the post-build import check standing between a broken tree and PyPI.
  #
  # The four suites are the sanctioned local floor from the engineering
  # contract, run here exactly as a developer runs them:
  #   make q   — minimum SQL regression battery (shapes)
  #   make rt  — rugo unit tests
  #   make dt  — draken unit tests
  #   make st  — skene native C++ suite + Python binding/scan/dispatch tests
  #
  # None of them need cloud credentials, so this job needs no secrets.
  #
  # Every suite runs even after an earlier one fails (`if: '!cancelled()'`) so
  # one red suite does not hide the state of the other three — but the job is
  # still red, and build-manylinux/build-macos `needs: floor`, so the publish
  # is blocked. This is a hard gate: never make a step continue-on-error.
  #
  # This is the floor, not the ceiling — sqllogictest (`make slt`) and the wider
  # battery are the next things to fold in.
  floor:
    name: opteryx floor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      # libssl-dev/pkg-config are needed by the vendored libcurl the HTTP client
      # statically links; Rust builds the opteryx.compute crate. Mirrors the
      # environment regression_suite.yaml compiles in.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --upgrade numpy cython setuptools-rust
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/tests/requirements.txt
          python -m uv pip install --upgrade -r $GITHUB_WORKSPACE/pyproject.toml

      - name: Compile
        run: make compile

      - name: make q — SQL shape regression battery
        if: ${{ !cancelled() }}
        run: make q

      - name: make rt — rugo unit tests
        if: ${{ !cancelled() }}
        run: make rt

      - name: make dt — draken unit tests
        if: ${{ !cancelled() }}
        run: make dt

      - name: make st — skene native suite + Python bindings
        if: ${{ !cancelled() }}
        run: make st

  build-manylinux:
    needs: floor
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # ── x86_64: native Intel/AMD runner.
          - arch: x86_64
            runner: ubuntu-latest
            runner-python: "3.11"
            pybuild: "3.11"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
          - arch: x86_64
            runner: ubuntu-latest
            runner-python: "3.12"
            pybuild: "3.12"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
          - arch: x86_64
            runner: ubuntu-latest
            runner-python: "3.13"
            pybuild: "3.13"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
          - arch: x86_64
            runner: ubuntu-latest
            runner-python: "3.14"
            pybuild: "3.14"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
          # ── aarch64: NATIVE ARM runner, no QEMU. `docker/setup-qemu-action`
          # would let ubuntu-latest build these, but emulating a manylinux
          # Rust + C++ + LTO build costs hours and risks the job time limit.
          # release-rugo.yaml and release-skene.yaml already build aarch64 on
          # ubuntu-24.04-arm natively; this matches them.
          #
          # Motivation: without these, `pip install opteryx-core` on any Linux
          # ARM host (AWS Graviton, Ampere) falls through to the sdist and
          # attempts an on-box Rust/C++ build. That blocks ClickBench's two
          # Graviton machines (c8g.4xlarge, c8g.metal-48xl), which cannot run
          # a source build in the benchmark harness.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runner-python: "3.11"
            pybuild: "3.11"
            manylinux_image: "quay.io/pypa/manylinux2014_aarch64"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runner-python: "3.12"
            pybuild: "3.12"
            manylinux_image: "quay.io/pypa/manylinux2014_aarch64"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runner-python: "3.13"
            pybuild: "3.13"
            manylinux_image: "quay.io/pypa/manylinux2014_aarch64"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runner-python: "3.14"
            pybuild: "3.14"
            manylinux_image: "quay.io/pypa/manylinux2014_aarch64"
    name: linux ${{ matrix.arch }} py${{ matrix.pybuild }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runner-python }}

      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          path: io

      - name: Set permissions for build-wheels.sh
        run: chmod +x io/dev/build-wheels.sh

      - name: Build Wheels
        # Builds optimized wheels with LTO enabled for better xxhash and critical path performance
        # PGO (Profile-Guided Optimization) is supported but disabled by default
        run: |
          set -euo pipefail

          ARCH="${{ matrix.arch }}"
          DESIRED_IMAGE="${{ matrix.manylinux_image }}"
          echo "Attempting to pull ${DESIRED_IMAGE}..."

          # Fallbacks are per-arch and MUST stay per-arch: `docker pull` of a
          # foreign-arch image succeeds, so a hardcoded x86_64 fallback on an
          # ARM runner would resolve happily and then either die with an exec
          # format error or (with binfmt registered) quietly build an x86 wheel
          # in the aarch64 job. The arch assertion below is the backstop.
          #
          # aarch64 deliberately does NOT mirror x86_64's manylinux_2_31
          # fallback: that image tags wheels manylinux_2_31, which the archive
          # glob (*manylinux2014_<arch>*) does not match, so it would upload an
          # empty artifact. See the note on the x86_64 fallback below.
          case "${ARCH}" in
            x86_64)
              # NOTE (pre-existing): this 2_31 fallback produces wheels the
              # Archive glob cannot match. Left as-is to avoid changing x86_64
              # behaviour in an aarch64 change — flagged, not fixed.
              FALLBACKS="ghcr.io/pypa/manylinux/manylinux_2_31_x86_64 quay.io/pypa/manylinux2014_x86_64"
              ;;
            aarch64)
              FALLBACKS="ghcr.io/pypa/manylinux2014_aarch64"
              ;;
            *)
              echo "ERROR: unsupported matrix arch '${ARCH}'" >&2
              exit 1
              ;;
          esac

          IMAGE=""
          for CANDIDATE in "${DESIRED_IMAGE}" ${FALLBACKS}; do
            if docker pull "${CANDIDATE}" 2>/dev/null; then
              IMAGE="${CANDIDATE}"
              break
            fi
            echo "Failed to pull ${CANDIDATE}; trying next candidate..."
          done

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: no manylinux image available for ${ARCH}. Tried: ${DESIRED_IMAGE} ${FALLBACKS}"
            echo "Available /opt/python in runner for debugging:"
            ls -1 /opt/python || true
            exit 125
          fi

          # Hard gate: the container MUST be the arch this matrix leg claims to
          # build. Without this a wrong-arch image silently produces a wheel
          # tagged for the other arch, which then collides with (or is dropped
          # by) the arch-keyed artifact and glob downstream.
          CONTAINER_ARCH="$(docker run --rm "${IMAGE}" uname -m)"
          if [ "${CONTAINER_ARCH}" != "${ARCH}" ]; then
            echo "ERROR: image ${IMAGE} reports arch '${CONTAINER_ARCH}', expected '${ARCH}'." >&2
            exit 1
          fi

          echo "Using container image: ${IMAGE} (${CONTAINER_ARCH})"

          docker run --rm \
            -e PLAT=manylinux2014_${ARCH} \
            -e PACKAGE_NAME=opteryx \
            -e PYTHON_VERSION=${{ matrix.pybuild }} \
            -e OPTERYX_ENABLE_LTO=1 \
            -e OPTERYX_ENABLE_PGO=0 \
            -e OPTERYX_VENDOR_CURL=1 \
            -v `pwd`:/io \
            --workdir /io \
            "${IMAGE}" \
            io/dev/build-wheels.sh

      - name: Verify wheel xxhash SIMD backend (in manylinux container)
        continue-on-error: true  # Don't fail the build if verification can't run
        run: |
          set -euo pipefail

          # Run verification inside the manylinux container so we install the
          # wheel using the *same* Python ABI it was built for.
          docker run --rm \
            -v `pwd`:/io \
            --workdir /io \
            "${{ matrix.manylinux_image }}" \
            bash -lc '
              set -euo pipefail
              FOUND=0
              echo "/opt/python entries:"
              ls -1 /opt/python || true

              for PY in /opt/python/*/bin/python*; do
                echo "Trying interpreter: $PY"
                VER=$($PY -c "import sys; print(f'cp{sys.version_info[0]}{sys.version_info[1]}')")
                WHEEL=$(ls /io/io/dist/*${VER}*manylinux*.whl 2>/dev/null || true)
                if [ -n "$WHEEL" ]; then
                  echo "Installing $WHEEL with $PY"
                  $PY -m pip install --no-deps "$WHEEL"
                  $PY -c "import opteryx.third_party.cyan4973.xxhash as _xh; print('release wheel xxhash compiled vector backend:', _xh.get_compiled_xxhash_vector())"
                  FOUND=1
                fi
              done

              if [ "$FOUND" -eq 0 ]; then
                echo "No compatible wheel found to verify; list dist:"
                ls -1 /io/io/dist || true
                exit 1
              fi
            '
      - name: Verify wheel imports (release gate — MUST NOT be continue-on-error)
        # 0.9.56 shipped a wheel whose every query failed at import with
        #   ImportError: undefined symbol: draken_cast_uint_to_string
        # while a dev build, `make q` (217/217) and `nm` symbol counts were all
        # green. Only importing the real manylinux wheel catches that class of
        # break, so this step gates the release. See dev/verify-wheel-imports.sh.
        run: |
          set -euo pipefail

          ARCH="${{ matrix.arch }}"
          DESIRED_IMAGE="${{ matrix.manylinux_image }}"

          # Arch-scoped, for the same reason as the build step: verifying an
          # aarch64 wheel inside an x86_64 container cannot install it, and this
          # step is a hard release gate — it must fail for the real reason, not
          # because it reached for the wrong container.
          case "${ARCH}" in
            x86_64)  FALLBACKS="ghcr.io/pypa/manylinux/manylinux_2_31_x86_64 quay.io/pypa/manylinux2014_x86_64" ;;
            aarch64) FALLBACKS="ghcr.io/pypa/manylinux2014_aarch64" ;;
            *) echo "ERROR: unsupported matrix arch '${ARCH}'" >&2; exit 1 ;;
          esac

          IMAGE=""
          for CANDIDATE in "${DESIRED_IMAGE}" ${FALLBACKS}; do
            if docker pull "${CANDIDATE}" 2>/dev/null; then
              IMAGE="${CANDIDATE}"
              break
            fi
          done

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: no manylinux image available for ${ARCH} to verify the wheel." >&2
            exit 1
          fi

          CONTAINER_ARCH="$(docker run --rm "${IMAGE}" uname -m)"
          if [ "${CONTAINER_ARCH}" != "${ARCH}" ]; then
            echo "ERROR: image ${IMAGE} reports arch '${CONTAINER_ARCH}', expected '${ARCH}'." >&2
            exit 1
          fi

          chmod +x io/dev/verify-wheel-imports.sh
          docker run --rm \
            -e OPTERYX_ALLOW_KNOWN_GRPC_ABORT="${OPTERYX_ALLOW_KNOWN_GRPC_ABORT:-0}" \
            -v `pwd`:/io \
            --workdir /io \
            "${IMAGE}" \
            io/dev/verify-wheel-imports.sh /io/io/dist
        env:
          # TODO(remove once the C++ symbol-hiding fix lands): 0.9.55 and the
          # 0.9.57 revert both abort on `import opteryx; import grpc`. Set to 1
          # so that KNOWN, pre-existing failure does not block a release that is
          # otherwise good — the bridge-symbol check (which caught 0.9.56 taking
          # production down) still gates hard. Setting this to 0 is the goal.
          OPTERYX_ALLOW_KNOWN_GRPC_ABORT: "1"

      - name: Archive Wheels
        uses: actions/upload-artifact@v4
        with:
          # Artifact name carries the ARCH as well as the Python version: with
          # both x86_64 and aarch64 in one matrix, `dist-linux-3.14` alone is
          # ambiguous and the second job to upload it would fail (or clobber).
          # Every "Stage linux" step in the `upload` job matches this exactly.
          name: dist-linux-${{ matrix.arch }}-${{ matrix.pybuild }}
          # auditwheel emits e.g. ...-manylinux_2_17_aarch64.manylinux2014_aarch64.whl,
          # so this glob must track the matrix arch — the old hardcoded
          # *_x86_64* matched nothing on ARM and would have uploaded an EMPTY
          # artifact, publishing an incomplete set without failing.
          path: io/dist/*manylinux2014_${{ matrix.arch }}*.whl
          if-no-files-found: error

  build-macos:
    needs: floor
    # macos-14 = Apple Silicon (arm64) only, Python 3.14 GIL build only.
    # Mirrors rugo's macOS build (release-rugo.yaml) but opteryx_core
    # additionally needs Rust (opteryx.compute) and libcurl.
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Make build script executable
        run: chmod +x dev/build-wheels-macos.sh

      - name: Build wheel (macos-14, py 3.14)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          OPTERYX_ENABLE_LTO: "1"
        run: ./dev/build-wheels-macos.sh

      - name: Archive Wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-3.14
          path: dist/delocated/*.whl

  upload:
    needs: [build-manylinux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip setuptools packaging wheel build cython setuptools_rust

      - name: Create source dist
        run: python setup.py sdist

      # Artifact names below MUST match `dist-linux-<arch>-<pybuild>` from
      # build-manylinux's Archive step exactly. download-artifact fails hard on
      # a name it cannot find, so a mismatch here is loud, not silent — that is
      # deliberate, and is why these stay enumerated rather than being replaced
      # by a single download-all + `find -exec mv`.
      - name: Stage linux x86_64 3.11 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-x86_64-3.11
          path: dist-linux-x86_64-3.11
      - run: mv -v dist-linux-x86_64-3.11/* dist/

      - name: Stage linux x86_64 3.12 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-x86_64-3.12
          path: dist-linux-x86_64-3.12
      - run: mv -v dist-linux-x86_64-3.12/* dist/

      - name: Stage linux x86_64 3.13 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-x86_64-3.13
          path: dist-linux-x86_64-3.13
      - run: mv -v dist-linux-x86_64-3.13/* dist/

      - name: Stage linux x86_64 3.14 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-x86_64-3.14
          path: dist-linux-x86_64-3.14
      - run: mv -v dist-linux-x86_64-3.14/* dist/

      - name: Stage linux aarch64 3.11 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-aarch64-3.11
          path: dist-linux-aarch64-3.11
      - run: mv -v dist-linux-aarch64-3.11/* dist/

      - name: Stage linux aarch64 3.12 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-aarch64-3.12
          path: dist-linux-aarch64-3.12
      - run: mv -v dist-linux-aarch64-3.12/* dist/

      - name: Stage linux aarch64 3.13 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-aarch64-3.13
          path: dist-linux-aarch64-3.13
      - run: mv -v dist-linux-aarch64-3.13/* dist/

      - name: Stage linux aarch64 3.14 (GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-aarch64-3.14
          path: dist-linux-aarch64-3.14
      - run: mv -v dist-linux-aarch64-3.14/* dist/

      - name: Stage macos 3.14 (arm64, GIL)
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-macos-3.14
          path: dist-macos-3.14
      - run: mv -v dist-macos-3.14/* dist/

      # Last gate before PyPI. Staging is 10 independent artifact downloads; if
      # any leg silently produced nothing the publish would still succeed and
      # ship an incomplete set, which is only discoverable by a user hitting a
      # missing wheel. Assert the exact expected matrix instead.
      - name: Verify the full artifact set is staged
        run: |
          set -euo pipefail
          echo "=== staged dist/ ===" && ls -1 dist/

          MISSING=0
          for ARCH in x86_64 aarch64; do
            for PY in 311 312 313 314; do
              if ! ls dist/*cp${PY}-cp${PY}-*manylinux2014_${ARCH}*.whl >/dev/null 2>&1; then
                echo "MISSING: linux ${ARCH} cp${PY} wheel"
                MISSING=1
              fi
            done
          done
          if ! ls dist/*cp314-cp314-*macosx*arm64*.whl >/dev/null 2>&1; then
            echo "MISSING: macos arm64 cp314 wheel"
            MISSING=1
          fi
          if ! ls dist/*.tar.gz >/dev/null 2>&1; then
            echo "MISSING: sdist"
            MISSING=1
          fi

          if [ "${MISSING}" -ne 0 ]; then
            echo "ERROR: refusing to publish an incomplete artifact set." >&2
            exit 1
          fi
          echo "All 8 linux wheels + macOS arm64 wheel + sdist present."

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}