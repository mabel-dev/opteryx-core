name: Semgrep Scan

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep, rugo, and upload client
        run: python -m pip install --no-cache-dir semgrep rugo opteryx-upload

      - name: Report Tool Versions
        run: |
          # Tools are deliberately unpinned so a new check reaches us the day it
          # ships. The cost of that is a run whose result depends on a version
          # nothing in the repo records — so record it here. A red build must be
          # reproducible from its own log.
          python --version
          semgrep --version

      - name: Run Semgrep
        run: semgrep scan --config=auto --json --output=semgrep-report.json

      - name: Upload results to Opteryx
        env:
          UPLOAD_CLIENT: ${{ secrets.UPLOAD_CLIENT }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: python scripts/upload_semgrep_results.py semgrep-report.json
