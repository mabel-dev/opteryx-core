name: Release to PyPI

on:
  release:
    types: [published]
    branches:
      - 'main'
  push:
    tags:
      - 'ci-*'

jobs:
  build-manylinux:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner-python: "3.13"
            pybuild: "3.13"
            manylinux_image: "quay.io/pypa/manylinux2014_x86_64"
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runner-python }}

      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          path: io

      - name: Set permissions for build-wheels.sh
        run: chmod +x io/dev/build-wheels.sh

      - name: Build Wheels
        # Builds optimized wheels with LTO enabled for better xxhash and critical path performance
        # PGO (Profile-Guided Optimization) is supported but disabled by default
        run: |
          set -euo pipefail

          DESIRED_IMAGE="${{ matrix.manylinux_image }}"
          echo "Attempting to pull ${DESIRED_IMAGE}..."

          # Try the configured image first; if it fails, try known fallbacks.
          if docker pull "${DESIRED_IMAGE}" 2>/dev/null; then
            IMAGE="${DESIRED_IMAGE}"
          else
            echo "Failed to pull ${DESIRED_IMAGE}; trying GHCR fallback..."
            if docker pull ghcr.io/pypa/manylinux/manylinux_2_31_x86_64 2>/dev/null; then
              IMAGE=ghcr.io/pypa/manylinux/manylinux_2_31_x86_64
            elif docker pull quay.io/pypa/manylinux2014_x86_64 2>/dev/null; then
              IMAGE=quay.io/pypa/manylinux2014_x86_64
            else
              echo "ERROR: no manylinux image available to run tests. Tried: ${DESIRED_IMAGE}, ghcr.io/pypa/manylinux/manylinux_2_31_x86_64, quay.io/pypa/manylinux2014_x86_64"
              echo "Available /opt/python in runner for debugging:"
              ls -1 /opt/python || true
              exit 125
            fi
          fi

          echo "Using container image: ${IMAGE}"

          docker run --rm \
            -e PLAT=manylinux2014_x86_64 \
            -e PACKAGE_NAME=opteryx \
            -e PYTHON_VERSION=${{ matrix.pybuild }} \
            -e OPTERYX_ENABLE_LTO=1 \
            -e OPTERYX_ENABLE_PGO=0 \
            -e OPTERYX_VENDOR_CURL=1 \
            -v `pwd`:/io \
            --workdir /io \
            "${IMAGE}" \
            io/dev/build-wheels.sh

      - name: Verify wheel xxhash SIMD backend (in manylinux container)
        continue-on-error: true  # Don't fail the build if verification can't run
        run: |
          set -euo pipefail

          # Run verification inside the manylinux container so we install the
          # wheel using the *same* Python ABI it was built for.
          docker run --rm \
            -v `pwd`:/io \
            --workdir /io \
            "${{ matrix.manylinux_image }}" \
            bash -lc '
              set -euo pipefail
              FOUND=0
              echo "/opt/python entries:"
              ls -1 /opt/python || true

              for PY in /opt/python/*/bin/python*; do
                echo "Trying interpreter: $PY"
                VER=$($PY -c "import sys; print(f'cp{sys.version_info[0]}{sys.version_info[1]}')")
                WHEEL=$(ls /io/io/dist/*${VER}*manylinux*.whl 2>/dev/null || true)
                if [ -n "$WHEEL" ]; then
                  echo "Installing $WHEEL with $PY"
                  $PY -m pip install --no-deps "$WHEEL"
                  $PY -c "import opteryx.third_party.cyan4973.xxhash as _xh; print('release wheel xxhash compiled vector backend:', _xh.get_compiled_xxhash_vector())"
                  FOUND=1
                fi
              done

              if [ "$FOUND" -eq 0 ]; then
                echo "No compatible wheel found to verify; list dist:"
                ls -1 /io/io/dist || true
                exit 1
              fi
            '
      - name: Archive Wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.pybuild }}
          path: io/dist/*manylinux2014_x86_64*.whl

  upload:
    needs: [build-manylinux]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip setuptools packaging wheel build cython numpy setuptools_rust

      - name: Create source dist
        run: python setup.py sdist

      - name: Stage linux 3.13
        uses: actions/download-artifact@v4.1.7
        with:
          name: dist-linux-3.13
          path: dist-linux-3.13
      - run: mv -v dist-linux-3.13/* dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}